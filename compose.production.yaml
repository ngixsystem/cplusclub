name: cclub-production
x-runtime: &runtime
  image: cclub-app:0.1.0
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    SESSION_SECURE_COOKIE: "true"
  volumes: [uploads:/var/www/html/storage/app/private]
  restart: unless-stopped
  stop_grace_period: 90s
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *runtime
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 15s
      retries: 5
  nginx:
    image: cclub-nginx:0.1.0
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
    depends_on: [app]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost/health/live]
      interval: 30s
      retries: 3
  queue:
    <<: *runtime
    command: [php, artisan, horizon]
    healthcheck:
      test: [CMD, php, artisan, horizon:status]
      interval: 30s
      retries: 3
  scheduler:
    <<: *runtime
    command: [php, artisan, schedule:work]
    healthcheck:
      test: [CMD, php, artisan, cclub:scheduler-health]
      interval: 60s
      start_period: 90s
      retries: 3
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cclub}
      POSTGRES_USER: ${DB_USERNAME:-cclub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a random password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8.10.2
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
volumes:
  uploads:
  postgres-data:
  redis-data:
