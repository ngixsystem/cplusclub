# Isolated staging stack on the VDS (project name: cclub-staging).
# Own database, Redis, uploads and demo data; Telegram uses the fake transport.
# Only the "web" service joins the external cclub-edge network, which the
# production Caddy also joins, so staging never shares a network with production services.
name: cclub-staging
x-app: &app
  image: cclub-app:dev
  env_file: .env
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: nginx:1.30.5
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/https-upstream.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases: [cclub-staging-web]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost/health/live]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cclub}
      POSTGRES_USER: ${DB_USERNAME:-cclub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10.2
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  node:
    image: node:24.14.0-bookworm-slim
    profiles: [tools]
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
networks:
  edge:
    name: cclub-edge
    external: true
volumes:
  postgres-data:
  redis-data:
