name: cclub-test
services:
  postgres:
    image: postgres:17.11
    environment: {POSTGRES_DB: cclub_test, POSTGRES_USER: cclub, POSTGRES_PASSWORD: isolated-test-only}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cclub -d cclub_test]
      interval: 3s
      retries: 15
  redis:
    image: redis:8.10.2
  app:
    image: cclub-app:dev
    volumes: [".:/var/www/html"]
    env_file: .env
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://nginx
      DB_DATABASE: cclub_test
      DB_PASSWORD: isolated-test-only
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      TELEGRAM_TRANSPORT: fake
    depends_on:
      postgres: {condition: service_healthy}
  nginx:
    image: nginx:1.30.5
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  browser:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    environment: {BASE_URL: "http://nginx"}
    command: [npx, playwright, test]
    profiles: [tools]
    depends_on: [nginx]
  python:
    image: python:3.13.7-slim-bookworm
    working_dir: /work
    volumes: [".:/work"]
    profiles: [tools]
