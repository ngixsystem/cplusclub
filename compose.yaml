name: cclub
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
  env_file: .env
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  restart: unless-stopped
  stop_grace_period: 90s
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.30.5
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost/health/live]
      interval: 30s
      timeout: 5s
      retries: 3
  queue:
    <<: *app
    command: [php, artisan, horizon]
    healthcheck:
      test: [CMD, php, artisan, horizon:status]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]
    healthcheck:
      test: [CMD, php, artisan, cclub:scheduler-health]
      interval: 60s
      start_period: 90s
      timeout: 10s
      retries: 3
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cclub}
      POSTGRES_USER: ${DB_USERNAME:-cclub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10.2
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  node:
    image: node:24.14.0-bookworm-slim
    profiles: [tools]
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    command: [npm, run, build]
volumes:
  postgres-data:
  redis-data:
